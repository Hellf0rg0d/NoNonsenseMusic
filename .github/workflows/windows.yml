# The Windows app: built and tested on a real Windows machine on every push that touches app/ (a Windows app can only
# be built on Windows), and packed here for a release: NoNonsenseMusic-Setup.exe (windows/installer.iss) and
# NoNonsenseMusic-Windows.zip, both under "Artifacts" on the run's page. Packed on Windows: a zip made on a Mac carried
# a "._" twin of every file (macOS's metadata), and a friend ran ._NoNonsenseMusic.exe ("This app can't run on your PC",
# 20 Oct).
name: Windows app

on:
  push:
    paths: ["app/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build windows --release
      # the app and every plugin load these three (msvcp140, vcruntime140, vcruntime140_1; ucrtbase is part of Windows
      # 10 and 11): beside the app, a PC without Microsoft's Visual C++ Redistributable runs it too
      - name: The Visual C++ runtime beside the app
        shell: pwsh
        run: |
          foreach ($dll in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            Copy-Item "$env:WINDIR\System32\$dll" build/windows/x64/runner/Release/
          }
      - name: The installer and the zip
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          $build = (Resolve-Path build/windows/x64/runner/Release).Path
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc /Qp "/DAppVersion=$version" "/DSourceDir=$build" windows/installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force build/zip | Out-Null
          Copy-Item -Recurse $build build/zip/NoNonsenseMusic
          Compress-Archive -Path build/zip/NoNonsenseMusic -DestinationPath build/installer/NoNonsenseMusic-Windows.zip
          Get-ChildItem build/installer | Format-Table Name, Length
      # an in-place update, end to end (test/windows_update_test.dart): the release setup installed (it opens the app),
      # then the app's own update code fetches a 9.9.9 setup of the same build from a local feed, checks its signature
      # and runs it. Windows' record of the app must say 9.9.9 after, and the app must be open again
      - name: In-place update, from this release to a 9.9.9 setup
        shell: pwsh
        timeout-minutes: 10
        run: |
          $build = (Resolve-Path build/windows/x64/runner/Release).Path
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc /Qp /O"build/e2e" "/DAppVersion=9.9.9" "/DSourceDir=$build" windows/installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # the setup alone: -Wait also waits for what it starts, and a silent setup opens the app, which never quits (25 Oct)
          $setup = Start-Process -PassThru build/installer/NoNonsenseMusic-Setup.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          $setup.WaitForExit()
          if ($setup.ExitCode -ne 0) { Write-Error "the release setup exited $($setup.ExitCode)"; exit 1 }
          Start-Sleep -Seconds 5
          $env:NN_E2E_NEW_SETUP = (Resolve-Path build/e2e/NoNonsenseMusic-Setup.exe).Path
          flutter test test/windows_update_test.dart
          $result = $LASTEXITCODE
          Stop-Process -Name NoNonsenseMusic -Force -ErrorAction SilentlyContinue
          exit $result
      - uses: actions/upload-artifact@v4
        with:
          name: NoNonsenseMusic-windows
          path: app/build/windows/x64/runner/Release/
      - uses: actions/upload-artifact@v4
        with:
          name: NoNonsenseMusic-windows-release
          path: app/build/installer/
