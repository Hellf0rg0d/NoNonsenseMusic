# The Mac app (mac/): built on a real Mac on every push that touches mac/ (Swift and SwiftUI for macOS 26 build only
# there). Then its accounts self-test (NN_SELFTEST_AUTH, Debug/AuthSelfTest.swift) runs against this branch's own
# server, which the app starts itself, on a fresh music_test database and port 8765, as mac/Scripts/selftest.sh does.
# The window pictures it takes are under "Artifacts" on the run's page.
name: Mac app

on:
  push:
    paths: ["mac/**", "backend/**", ".github/workflows/mac.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Xcode (the newest on the runner)
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Project file (cd mac && xcodegen)
        working-directory: mac
        run: |
          brew install xcodegen
          xcodegen
          # a committed project file without a new source file fails the daily build (which runs no xcodegen)
          git diff --exit-code -- NoNonsense.xcodeproj || echo "::warning::XcodeGen changed the project file: commit the diff above"
      - name: Build Debug (the self-tests' build)
        working-directory: mac
        run: |
          xcodebuild -project NoNonsense.xcodeproj -scheme NoNonsense -configuration Debug -derivedDataPath build build > debug.log 2>&1 || true
          grep -E "error:" debug.log | sort -u | head -40
          grep -E "warning:" debug.log | grep -v "appintentsmetadataprocessor" | sort -u | head -40
          grep -E "\*\* BUILD" debug.log
          grep -q "BUILD SUCCEEDED" debug.log
      - name: Build Release (daily use)
        working-directory: mac
        run: |
          xcodebuild -project NoNonsense.xcodeproj -scheme NoNonsense -configuration Release -derivedDataPath build build > release.log 2>&1 || true
          grep -E "error:" release.log | sort -u | head -40
          grep -E "\*\* BUILD" release.log
          grep -q "BUILD SUCCEEDED" release.log
          # the names macOS shows (menu bar and About: CFBundleName; Finder and Dock: the bundle's file name)
          app=build/Build/Products/Release/NoNonsenseMusic.app
          echo "$app: CFBundleName=$(/usr/libexec/PlistBuddy -c 'Print CFBundleName' $app/Contents/Info.plist)," \
               "CFBundleDisplayName=$(/usr/libexec/PlistBuddy -c 'Print CFBundleDisplayName' $app/Contents/Info.plist)"
      - name: Test database (PostgreSQL 18, music_test) and the server's packages
        run: |
          brew install postgresql@18 uv
          pg=$(brew --prefix postgresql@18)/bin
          $pg/initdb -D "$RUNNER_TEMP/pg" --auth=trust > /dev/null
          $pg/pg_ctl -D "$RUNNER_TEMP/pg" -l "$RUNNER_TEMP/pg.log" start
          $pg/createdb music_test
          cd backend && uv sync --frozen
      - name: Self-test, accounts (NN_SELFTEST_AUTH), on the test server the app starts (8765, music_test)
        run: |
          mkdir -p "$RUNNER_TEMP/snaps"
          env NN_SELFTEST_AUTH=1 NN_SELFTEST_SNAP="$RUNNER_TEMP/snaps" DATABASE_URL=postgresql:///music_test \
            perl -e 'alarm shift; exec @ARGV' 240 mac/build/Build/Products/Debug/NoNonsenseMusic.app/Contents/MacOS/NoNonsenseMusic \
            -serverURL http://127.0.0.1:8765 -backendFolder "$GITHUB_WORKSPACE/backend" \
            -discordEnabled NO -ApplePersistenceIgnoreState YES -look new > selftest.log 2>&1 || true
          grep SELFTEST selftest.log
          echo "--- the server's answers (requests only; the repo is public: no addresses, no URLs)"
          grep -hE '"(GET|POST|PUT|PATCH|DELETE) /' ~/Library/Logs/NoNonsense/server-selftest.log \
            | sed -E 's/^.*"((GET|POST|PUT|PATCH|DELETE) [^ ?]*)[^"]*" ([0-9]+).*$/\1 \3/' | sed -E 's/[0-9a-f-]{36}/<id>/g' | sort | uniq -c
          grep -q "auth: all checks pass" selftest.log
      - name: Self-test, full screen (NN_SELFTEST_FULLSCREEN), with real screenshots
        run: |
          env NN_SELFTEST_FULLSCREEN=1 NN_SELFTEST_SNAP="$RUNNER_TEMP/snaps" DATABASE_URL=postgresql:///music_test \
            perl -e 'alarm shift; exec @ARGV' 240 mac/build/Build/Products/Debug/NoNonsenseMusic.app/Contents/MacOS/NoNonsenseMusic \
            -serverURL http://127.0.0.1:8765 -backendFolder "$GITHUB_WORKSPACE/backend" \
            -discordEnabled NO -ApplePersistenceIgnoreState YES -look new > fullscreen.log 2>&1 || true
          grep SELFTEST fullscreen.log
          grep -q "fullscreen: all checks pass" fullscreen.log
      - name: Self-test, YouTube's loader (NN_SELFTEST_LOADER), on a local file; then latency on real songs (counts only)
        run: |
          env NN_SELFTEST_LOADER=1 DATABASE_URL=postgresql:///music_test \
            perl -e 'alarm shift; exec @ARGV' 120 mac/build/Build/Products/Debug/NoNonsenseMusic.app/Contents/MacOS/NoNonsenseMusic \
            -serverURL http://127.0.0.1:8765 -backendFolder "$GITHUB_WORKSPACE/backend" \
            -discordEnabled NO -ApplePersistenceIgnoreState YES -look new > loader.log 2>&1 || true
          grep SELFTEST loader.log
          grep -q "loader: all checks pass" loader.log
      - name: Self-test, latency (NN_SELFTEST_LATENCY) on real songs, if YouTube and JioSaavn answer this runner
        continue-on-error: true
        run: |
          env NN_SELFTEST_LATENCY=1 DATABASE_URL=postgresql:///music_test \
            perl -e 'alarm shift; exec @ARGV' 200 mac/build/Build/Products/Debug/NoNonsenseMusic.app/Contents/MacOS/NoNonsenseMusic \
            -serverURL http://127.0.0.1:8765 -backendFolder "$GITHUB_WORKSPACE/backend" \
            -discordEnabled NO -ApplePersistenceIgnoreState YES -look new > latency.log 2>&1 || true
          grep "SELFTEST latency" latency.log
      - name: Self-test, Genius notes (NN_SELFTEST_GENIUS), on made-up lyrics and notes
        run: |
          env NN_SELFTEST_GENIUS=1 NN_SELFTEST_SNAP="$RUNNER_TEMP/snaps" DATABASE_URL=postgresql:///music_test \
            perl -e 'alarm shift; exec @ARGV' 240 mac/build/Build/Products/Debug/NoNonsenseMusic.app/Contents/MacOS/NoNonsenseMusic \
            -serverURL http://127.0.0.1:8765 -backendFolder "$GITHUB_WORKSPACE/backend" \
            -discordEnabled NO -ApplePersistenceIgnoreState YES -look new > genius.log 2>&1 || true
          grep SELFTEST genius.log
          grep -q "genius: all checks pass" genius.log
      - name: Genius, live (the server's lookup against genius.com; counts only, never the text)
        continue-on-error: true            # Genius's website API is undocumented and may refuse a data centre
        working-directory: backend
        run: |
          uv run python -c '
          import asyncio, time
          from music_backend.models import GeniusRequest
          from music_backend.services import genius
          async def main():
              for name, artist in [("Bohemian Rhapsody", "Queen"), ("Blinding Lights", "The Weeknd")]:
                  start = time.monotonic()
                  reply = await genius.find_notes(GeniusRequest(song_name=name, artist_name=artist))
                  about = reply.about
                  print(f"{name}: found {reply.url is not None}, {len(reply.notes)} notes, about: description "
                        f"{bool(about and about.description)}, {len(about.produced_by) if about else 0} producers, "
                        f"{len(about.samples) if about else 0} samples, {time.monotonic() - start:.1f} s")
          asyncio.run(main())'
      - name: Self-test, the queue's rules (NN_SELFTEST_QUEUE), on made-up songs
        if: ${{ !cancelled() }}
        run: |
          lsof -ti tcp:8765 | xargs kill 2>/dev/null || true
          env NN_SELFTEST_QUEUE=1 DATABASE_URL=postgresql:///music_test \
            perl -e 'alarm shift; exec @ARGV' 120 mac/build/Build/Products/Debug/NoNonsenseMusic.app/Contents/MacOS/NoNonsenseMusic \
            -serverURL http://127.0.0.1:8765 -backendFolder "$GITHUB_WORKSPACE/backend" \
            -discordEnabled NO -ApplePersistenceIgnoreState YES -look new > queue.log 2>&1 || true
          grep SELFTEST queue.log
          grep -q "queue: all rules pass" queue.log
      # The redesign (15 Oct, as in the Windows app): each part's checks, with pictures of the window as it is on screen
      - name: Self-test, sidebar, Library and Jam (NN_SELFTEST_SHELL)
        if: ${{ !cancelled() }}
        run: |
          lsof -ti tcp:8765 | xargs kill 2>/dev/null || true      # a server left by a run the alarm stopped: never this app's
          env NN_SELFTEST_SHELL=1 NN_SELFTEST_VISIBLE=1 NN_SELFTEST_SNAP="$RUNNER_TEMP/snaps" DATABASE_URL=postgresql:///music_test \
            perl -e 'alarm shift; exec @ARGV' 240 mac/build/Build/Products/Debug/NoNonsenseMusic.app/Contents/MacOS/NoNonsenseMusic \
            -serverURL http://127.0.0.1:8765 -backendFolder "$GITHUB_WORKSPACE/backend" \
            -discordEnabled NO -ApplePersistenceIgnoreState YES -look new > shell.log 2>&1 || true
          grep SELFTEST shell.log
          grep -q "shell: all checks pass" shell.log
      - name: Self-test, downloads as files and their folder (NN_SELFTEST_DOWNLOADFILES)
        if: ${{ !cancelled() }}
        run: |
          lsof -ti tcp:8765 | xargs kill 2>/dev/null || true      # a server left by a run the alarm stopped: never this app's
          env NN_SELFTEST_DOWNLOADFILES=1 NN_SELFTEST_SNAP="$RUNNER_TEMP/snaps" DATABASE_URL=postgresql:///music_test \
            perl -e 'alarm shift; exec @ARGV' 180 mac/build/Build/Products/Debug/NoNonsenseMusic.app/Contents/MacOS/NoNonsenseMusic \
            -serverURL http://127.0.0.1:8765 -backendFolder "$GITHUB_WORKSPACE/backend" \
            -discordEnabled NO -ApplePersistenceIgnoreState YES -look new > downloadfiles.log 2>&1 || true
          grep SELFTEST downloadfiles.log
          grep -q "downloadfiles: all checks pass" downloadfiles.log
      - name: Self-test, album, artist and playlist pages (NN_SELFTEST_PAGES)
        if: ${{ !cancelled() }}
        run: |
          lsof -ti tcp:8765 | xargs kill 2>/dev/null || true      # a server left by a run the alarm stopped: never this app's
          env NN_SELFTEST_PAGES=1 NN_SELFTEST_VISIBLE=1 NN_SELFTEST_SNAP="$RUNNER_TEMP/snaps" DATABASE_URL=postgresql:///music_test \
            perl -e 'alarm shift; exec @ARGV' 240 mac/build/Build/Products/Debug/NoNonsenseMusic.app/Contents/MacOS/NoNonsenseMusic \
            -serverURL http://127.0.0.1:8765 -backendFolder "$GITHUB_WORKSPACE/backend" \
            -discordEnabled NO -ApplePersistenceIgnoreState YES -look new > pages.log 2>&1 || true
          grep SELFTEST pages.log
          grep -q "pages: all checks pass" pages.log
      - name: Self-test, player bar and Now Playing (NN_SELFTEST_BAR2)
        if: ${{ !cancelled() }}
        run: |
          lsof -ti tcp:8765 | xargs kill 2>/dev/null || true      # a server left by a run the alarm stopped: never this app's
          env NN_SELFTEST_BAR2=1 NN_SELFTEST_VISIBLE=1 NN_SELFTEST_SNAP="$RUNNER_TEMP/snaps" DATABASE_URL=postgresql:///music_test \
            perl -e 'alarm shift; exec @ARGV' 180 mac/build/Build/Products/Debug/NoNonsenseMusic.app/Contents/MacOS/NoNonsenseMusic \
            -serverURL http://127.0.0.1:8765 -backendFolder "$GITHUB_WORKSPACE/backend" \
            -discordEnabled NO -ApplePersistenceIgnoreState YES -look new > bar2.log 2>&1 || true
          grep SELFTEST bar2.log
          grep -q "bar2: all checks pass" bar2.log
      - name: Self-test, Home (NN_SELFTEST_HOMEHERO)
        if: ${{ !cancelled() }}
        run: |
          lsof -ti tcp:8765 | xargs kill 2>/dev/null || true      # a server left by a run the alarm stopped: never this app's
          env NN_SELFTEST_HOMEHERO=1 NN_SELFTEST_VISIBLE=1 NN_SELFTEST_SNAP="$RUNNER_TEMP/snaps" DATABASE_URL=postgresql:///music_test \
            perl -e 'alarm shift; exec @ARGV' 240 mac/build/Build/Products/Debug/NoNonsenseMusic.app/Contents/MacOS/NoNonsenseMusic \
            -serverURL http://127.0.0.1:8765 -backendFolder "$GITHUB_WORKSPACE/backend" \
            -discordEnabled NO -ApplePersistenceIgnoreState YES -look new > homehero.log 2>&1 || true
          grep SELFTEST homehero.log
          grep -q "homehero: all checks pass" homehero.log
      - name: Pictures of the Classic look (Settings › Appearance › Look) - pictures only, the checks are the New look's
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/snaps/classic"
          for test in SHELL PAGES HOMEHERO; do
            lsof -ti tcp:8765 | xargs kill 2>/dev/null || true
            env NN_SELFTEST_$test=1 NN_SELFTEST_VISIBLE=1 NN_SELFTEST_SNAP="$RUNNER_TEMP/snaps/classic" DATABASE_URL=postgresql:///music_test \
              perl -e 'alarm shift; exec @ARGV' 240 mac/build/Build/Products/Debug/NoNonsenseMusic.app/Contents/MacOS/NoNonsenseMusic \
              -serverURL http://127.0.0.1:8765 -backendFolder "$GITHUB_WORKSPACE/backend" \
              -discordEnabled NO -ApplePersistenceIgnoreState YES -look classic > classic-$test.log 2>&1 || true
          done
          ls "$RUNNER_TEMP/snaps/classic" || true
      - name: Self-test, the command bar and its keys (NN_SELFTEST_COMMANDBAR)
        if: ${{ !cancelled() }}
        run: |
          lsof -ti tcp:8765 | xargs kill 2>/dev/null || true      # a server left by a run the alarm stopped: never this app's
          env NN_SELFTEST_COMMANDBAR=1 NN_SELFTEST_VISIBLE=1 NN_SELFTEST_SNAP="$RUNNER_TEMP/snaps" DATABASE_URL=postgresql:///music_test \
            perl -e 'alarm shift; exec @ARGV' 240 mac/build/Build/Products/Debug/NoNonsenseMusic.app/Contents/MacOS/NoNonsenseMusic \
            -serverURL http://127.0.0.1:8765 -backendFolder "$GITHUB_WORKSPACE/backend" \
            -discordEnabled NO -ApplePersistenceIgnoreState YES -look new > commandbar.log 2>&1 || true
          grep SELFTEST commandbar.log
          grep -q "commandbar: all checks pass" commandbar.log
      - name: Self-test, your songs first in a search, and with no server (NN_SELFTEST_LIBRARYSEARCH)
        if: ${{ !cancelled() }}
        run: |
          lsof -ti tcp:8765 | xargs kill 2>/dev/null || true      # a server left by a run the alarm stopped: never this app's
          # a song on the test server, as one a search once returned: the test likes it and searches with a typo of it
          (cd backend && DATABASE_URL=postgresql:///music_test uv run python -c '
          import asyncio
          from music_backend.core import db
          from music_backend.models import Listing
          from music_backend.services import library
          async def main():
              pool = db.make_pool("postgresql:///music_test")
              await pool.open()
              await db.migrate(pool)
              async with pool.connection() as conn:
                  await library.resolve_song(conn, [Listing(source="jiosaavn", id="selftest-library-zanzibar", title="Zanzibar Lanterns",
                                                            artists=["Selftest Band"], album=None, duration=201, popularity=None)])
              await pool.close()
          asyncio.run(main())')
          env NN_SELFTEST_LIBRARYSEARCH=1 NN_SELFTEST_VISIBLE=1 NN_SELFTEST_SNAP="$RUNNER_TEMP/snaps" DATABASE_URL=postgresql:///music_test \
            perl -e 'alarm shift; exec @ARGV' 240 mac/build/Build/Products/Debug/NoNonsenseMusic.app/Contents/MacOS/NoNonsenseMusic \
            -serverURL http://127.0.0.1:8765 -backendFolder "$GITHUB_WORKSPACE/backend" \
            -discordEnabled NO -ApplePersistenceIgnoreState YES -look new > librarysearch.log 2>&1 || true
          grep SELFTEST librarysearch.log
          grep -q "librarysearch: all checks pass" librarysearch.log
      - name: Self-test, jam (NN_SELFTEST_JAM), the scenarios of docs/jam.md with two accounts and songs made here
        if: ${{ !cancelled() }}
        run: |
          lsof -ti tcp:8765 | xargs kill 2>/dev/null || true      # a server left by a run the alarm stopped: never this app's
          env NN_SELFTEST_JAM=1 NN_SELFTEST_SNAP="$RUNNER_TEMP/snaps" DATABASE_URL=postgresql:///music_test \
            perl -e 'alarm shift; exec @ARGV' 240 mac/build/Build/Products/Debug/NoNonsenseMusic.app/Contents/MacOS/NoNonsenseMusic \
            -serverURL http://127.0.0.1:8765 -backendFolder "$GITHUB_WORKSPACE/backend" \
            -discordEnabled NO -ApplePersistenceIgnoreState YES -look new > jam.log 2>&1 || true
          grep SELFTEST jam.log
          grep -q "jam: all checks pass" jam.log
      - name: Self-test, in-place update (NN_SELFTEST_UPDATE), from a local feed signed with the test key
        if: ${{ !cancelled() }}
        run: |
          set -e
          T="$RUNNER_TEMP/update"; rm -rf "$T"; mkdir -p "$T/tools" "$T/feed" "$T/bad" "$T/old" "$T/old2" "$T/evil"
          # Sparkle's signing tool, as pinned (mac/project.yml), checked against GitHub's digest of the release file
          gh release download 2.10.0 --repo sparkle-project/Sparkle -p Sparkle-2.10.0.tar.xz -D "$T"
          echo "c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c  $T/Sparkle-2.10.0.tar.xz" | shasum -a 256 -c
          tar -xJf "$T/Sparkle-2.10.0.tar.xz" -C "$T/tools"
          APP=mac/build/Build/Products/Debug/NoNonsenseMusic.app
          # the update: this build as 9.9.9 (999), signed again ad hoc, zipped as a release is
          ditto "$APP" "$T/new/NoNonsenseMusic.app"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 9.9.9" -c "Set :CFBundleVersion 999" "$T/new/NoNonsenseMusic.app/Contents/Info.plist"
          codesign --force --deep -s - "$T/new/NoNonsenseMusic.app"
          (cd "$T/new" && ditto -c -k --keepParent NoNonsenseMusic.app "$T/feed/NoNonsenseMusic-macOS.zip")
          python3 -I scripts/make-update-feeds.py --version 9.9.9 --build 999 --notes README.md --base-url http://127.0.0.1:8799 \
            --out "$T/feed" --sign "$T/tools/bin/sign_update" --key-file mac/UpdateTest/test-update-private.key "$T/feed/NoNonsenseMusic-macOS.zip"
          # a tampered update: the same appcast, but the zip it points to is another file
          # (its link moved to the bad server: a copy still pointing at 8799 fetched the good zip and installed it, 25 Oct)
          sed 's|http://127.0.0.1:8799/|http://127.0.0.1:8800/|' "$T/feed/appcast.xml" > "$T/bad/appcast.xml"
          grep -q "127.0.0.1:8800/NoNonsenseMusic-macOS.zip" "$T/bad/appcast.xml"
          # what an attacker would serve: a real zip of a changed app (one file added, signed again ad hoc), with the
          # genuine zip's signature. It unzips fine; only the EdDSA signature can tell (random bytes failed to unzip, 25 Oct)
          ditto "$T/new/NoNonsenseMusic.app" "$T/evil/NoNonsenseMusic.app"
          echo "not from NoNonsenseMusic" > "$T/evil/NoNonsenseMusic.app/Contents/Resources/changed.txt"
          codesign --force --deep -s - "$T/evil/NoNonsenseMusic.app"
          (cd "$T/evil" && ditto -c -k --keepParent NoNonsenseMusic.app "$T/bad/NoNonsenseMusic-macOS.zip")
          (cd "$T/feed" && python3 -m http.server 8799 --bind 127.0.0.1 > /dev/null 2>&1 &)
          (cd "$T/bad" && python3 -m http.server 8800 --bind 127.0.0.1 > "$T/bad.log" 2>&1 &)
          sleep 2
          ditto "$APP" "$T/old/NoNonsenseMusic.app"; ditto "$APP" "$T/old2/NoNonsenseMusic.app"
          run() {   # the app at $1, with the feed $2: signed in on its own test server, it updates itself, or refuses
            lsof -ti tcp:8765 | xargs kill 2>/dev/null || true
            env NN_SELFTEST_UPDATE=1 NN_UPDATE_FEED="$2" DATABASE_URL=postgresql:///music_test \
              perl -e 'alarm shift; exec @ARGV' 120 "$1/Contents/MacOS/NoNonsenseMusic" \
              -serverURL http://127.0.0.1:8765 -backendFolder "$GITHUB_WORKSPACE/backend" \
              -discordEnabled NO -ApplePersistenceIgnoreState YES > "$3" 2>&1 || true
          }
          version() { /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$1/Contents/Info.plist"; }
          set +e
          run "$T/old/NoNonsenseMusic.app" http://127.0.0.1:8799/appcast.xml update.log
          for i in $(seq 1 60); do [ "$(version "$T/old/NoNonsenseMusic.app")" = 999 ] && break; sleep 1; done
          grep SELFTEST update.log
          echo "the app on disk after the update: build $(version "$T/old/NoNonsenseMusic.app")"
          sleep 5; pgrep -fl "$T/old/NoNonsenseMusic.app" && echo "the new version opened"
          pkill -f "$T/old/NoNonsenseMusic.app" || true
          rm -rf "$HOME/Library/Caches/app.nononsense.music.debug/org.sparkle-project.Sparkle"   # nothing the first run fetched
          run "$T/old2/NoNonsenseMusic.app" http://127.0.0.1:8800/appcast.xml update-bad.log
          grep SELFTEST update-bad.log
          echo "the app on disk after the tampered update: build $(version "$T/old2/NoNonsenseMusic.app")"
          echo "the tampered server was asked for:"; grep -o '"GET [^"]*"' "$T/bad.log" || true
          fail() { echo "FAILED: $1"; exit 1; }
          [ "$(version "$T/old/NoNonsenseMusic.app")" = 999 ] || fail "the update was not installed"
          grep -q "update: ready to install 999" update.log || fail "Sparkle did not get the update ready"
          grep -q "GET /NoNonsenseMusic-macOS.zip" "$T/bad.log" || fail "the tampered file was never asked for"
          grep -qi "update: aborted.*sign" update-bad.log || fail "the tampered update was not refused for its signature"
          [ "$(version "$T/old2/NoNonsenseMusic.app")" = "$(version "$APP")" ] || fail "the tampered update was installed"   # the build it started as (it said 10 until 0.5.0 made it 13)
          [ ! -e "$T/old2/NoNonsenseMusic.app/Contents/Resources/changed.txt" ] || fail "the tampered app is on disk"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Self-test, equalizer (NN_SELFTEST_EQ), on tones made here
        if: ${{ !cancelled() }}
        run: |
          lsof -ti tcp:8765 | xargs kill 2>/dev/null || true
          env NN_SELFTEST_EQ=1 DATABASE_URL=postgresql:///music_test \
            perl -e 'alarm shift; exec @ARGV' 120 mac/build/Build/Products/Debug/NoNonsenseMusic.app/Contents/MacOS/NoNonsenseMusic \
            -serverURL http://127.0.0.1:8765 -backendFolder "$GITHUB_WORKSPACE/backend" \
            -discordEnabled NO -ApplePersistenceIgnoreState YES -look new > eq.log 2>&1 || true
          grep SELFTEST eq.log
          grep -q "eq: all checks pass" eq.log
      - name: Self-test, same volume for every song (NN_SELFTEST_LEVEL), on tones made here
        if: ${{ !cancelled() }}
        run: |
          lsof -ti tcp:8765 | xargs kill 2>/dev/null || true
          env NN_SELFTEST_LEVEL=1 DATABASE_URL=postgresql:///music_test \
            perl -e 'alarm shift; exec @ARGV' 120 mac/build/Build/Products/Debug/NoNonsenseMusic.app/Contents/MacOS/NoNonsenseMusic \
            -serverURL http://127.0.0.1:8765 -backendFolder "$GITHUB_WORKSPACE/backend" \
            -discordEnabled NO -ApplePersistenceIgnoreState YES -look new > level.log 2>&1 || true
          grep SELFTEST level.log
          grep -q "level: all checks pass" level.log
      - name: Self-test, no gaps between songs (NN_SELFTEST_GAPLESS), on tones made here
        if: ${{ !cancelled() }}
        run: |
          lsof -ti tcp:8765 | xargs kill 2>/dev/null || true
          env NN_SELFTEST_GAPLESS=1 DATABASE_URL=postgresql:///music_test \
            perl -e 'alarm shift; exec @ARGV' 120 mac/build/Build/Products/Debug/NoNonsenseMusic.app/Contents/MacOS/NoNonsenseMusic \
            -serverURL http://127.0.0.1:8765 -backendFolder "$GITHUB_WORKSPACE/backend" \
            -discordEnabled NO -ApplePersistenceIgnoreState YES -look new > gapless.log 2>&1 || true
          grep SELFTEST gapless.log
          grep -q "gapless: all checks pass" gapless.log
      - name: Self-test, Autoplay (NN_SELFTEST_AUTOPLAY) on real songs, if YouTube Music and JioSaavn answer this runner
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          lsof -ti tcp:8765 | xargs kill 2>/dev/null || true
          env NN_SELFTEST_AUTOPLAY=1 DATABASE_URL=postgresql:///music_test \
            perl -e 'alarm shift; exec @ARGV' 120 mac/build/Build/Products/Debug/NoNonsenseMusic.app/Contents/MacOS/NoNonsenseMusic \
            -serverURL http://127.0.0.1:8765 -backendFolder "$GITHUB_WORKSPACE/backend" \
            -discordEnabled NO -ApplePersistenceIgnoreState YES -look new > autoplay.log 2>&1 || true
          grep SELFTEST autoplay.log
          grep -q "autoplay: all checks pass" autoplay.log
      - name: Self-test, Now Playing's text on any cover (NN_SELFTEST_READABLE)
        if: ${{ !cancelled() }}
        run: |
          lsof -ti tcp:8765 | xargs kill 2>/dev/null || true      # a server left by a run the alarm stopped: never this app's
          env NN_SELFTEST_READABLE=1 NN_SELFTEST_VISIBLE=1 NN_SELFTEST_SNAP="$RUNNER_TEMP/snaps" DATABASE_URL=postgresql:///music_test \
            perl -e 'alarm shift; exec @ARGV' 300 mac/build/Build/Products/Debug/NoNonsenseMusic.app/Contents/MacOS/NoNonsenseMusic \
            -serverURL http://127.0.0.1:8765 -backendFolder "$GITHUB_WORKSPACE/backend" \
            -discordEnabled NO -ApplePersistenceIgnoreState YES -look new > readable.log 2>&1 || true
          grep SELFTEST readable.log
          grep -q "readable: all checks pass" readable.log
      - name: Self-test, Settings › Lyrics › Translate into (NN_SELFTEST_TRANSLATEINTO), on made-up songs
        if: ${{ !cancelled() }}
        run: |
          lsof -ti tcp:8765 | xargs kill 2>/dev/null || true      # a server left by a run the alarm stopped: never this app's
          env NN_SELFTEST_TRANSLATEINTO=1 NN_SELFTEST_VISIBLE=1 NN_SELFTEST_SNAP="$RUNNER_TEMP/snaps" DATABASE_URL=postgresql:///music_test \
            perl -e 'alarm shift; exec @ARGV' 240 mac/build/Build/Products/Debug/NoNonsenseMusic.app/Contents/MacOS/NoNonsenseMusic \
            -serverURL http://127.0.0.1:8765 -backendFolder "$GITHUB_WORKSPACE/backend" \
            -discordEnabled NO -ApplePersistenceIgnoreState YES -look new > translateinto.log 2>&1 || true
          grep SELFTEST translateinto.log
          grep -q "translateinto: all checks pass" translateinto.log
      - name: CPU at rest on Home (NN_SELFTEST_IDLE; the Debug build, so above what you would see; a number, not a check)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          lsof -ti tcp:8765 | xargs kill 2>/dev/null || true
          env NN_SELFTEST_IDLE=40 NN_SELFTEST_VISIBLE=1 DATABASE_URL=postgresql:///music_test \
            mac/build/Build/Products/Debug/NoNonsenseMusic.app/Contents/MacOS/NoNonsenseMusic \
            -serverURL http://127.0.0.1:8765 -backendFolder "$GITHUB_WORKSPACE/backend" \
            -discordEnabled NO -ApplePersistenceIgnoreState YES -look new > idle.log 2>&1 &
          app=$!
          for i in $(seq 1 60); do grep -q "idle: on Home now" idle.log && break; sleep 1; done
          sleep 8                                                  # Home settles: covers, the entrance
          # top's first sample has no interval behind it: the 20 after it are the measurement
          top -l 21 -s 1 -pid $app -stats cpu > cpu.txt || true
          awk 'NF == 1 && $1 ~ /^[0-9]+([.][0-9]+)?$/ { n++; if (n > 1) { s += $1; c++ } }
            END { if (c) printf "CPU at rest on Home: %.1f%% of one core, %d one-second samples\n", s / c, c;
                  else print "CPU at rest on Home: no samples; top ended with:" }' cpu.txt
          tail -4 cpu.txt
          grep SELFTEST idle.log || true
          wait $app || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-selftest-pictures
          path: ${{ runner.temp }}/snaps/
          if-no-files-found: ignore
